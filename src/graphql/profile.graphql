mutation UpdateViewer($input: UpdateViewerInput!) {
  updateViewer(input: $input) {
    viewer {
      id
      displayName
    }
    userErrors {
      code
      message
      path
    }
  }
}

mutation DeleteViewerAccount {
  deleteViewerAccount {
    success
    userErrors {
      code
      message
      path
    }
  }
}
