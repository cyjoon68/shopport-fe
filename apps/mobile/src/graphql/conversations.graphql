fragment ConversationSummary on Conversation {
  id
  title
  createdAt
  updatedAt
}

query Conversations($after: String) {
  conversations(first: 20, after: $after) {
    edges {
      cursor
      node {
        ...ConversationSummary
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

query Conversation($id: UUID!) {
  conversation(id: $id) {
    ...ConversationSummary
    messages {
      id
      role
      status
      createdAt
      parts {
        __typename
        ... on TextMessagePart {
          id
          text
        }
        ... on AskUserMessagePart {
          id
          question
          options {
            id
            label
          }
          allowFreeText
        }
        ... on ImageMessagePart {
          id
          asset {
            id
            status
            url
          }
        }
        ... on ProductReferenceMessagePart {
          id
          product {
            ...ProductCard
          }
        }
        ... on ToolStatusMessagePart {
          id
          toolName
          status
        }
      }
    }
  }
}

query FoundProducts($first: Int!, $after: String) {
  conversations(first: $first, after: $after) {
    edges {
      cursor
      node {
        messages {
          parts {
            __typename
            ... on ProductReferenceMessagePart {
              id
              product {
                ...ProductCard
              }
            }
          }
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

query UploadedImages($first: Int!, $after: String) {
  conversations(first: $first, after: $after) {
    edges {
      cursor
      node {
        messages {
          parts {
            __typename
            ... on ImageMessagePart {
              id
              asset {
                id
                url
              }
            }
          }
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

mutation CreateConversation($input: CreateConversationInput!) {
  createConversation(input: $input) {
    conversation {
      ...ConversationSummary
    }
    userErrors {
      code
      message
      path
    }
  }
}

mutation RenameConversation($input: RenameConversationInput!) {
  renameConversation(input: $input) {
    conversation {
      ...ConversationSummary
    }
    userErrors {
      code
      message
      path
    }
  }
}

mutation DeleteConversation($input: DeleteConversationInput!) {
  deleteConversation(input: $input) {
    success
    userErrors {
      code
      message
      path
    }
  }
}
