packages:
  - apps/*
  - packages/*
allowBuilds:
  '@sentry/cli': true
  esbuild: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@apollo/client@4.2.11'
  - '@graphql-codegen/client-preset@6.1.3'
  - '@graphql-codegen/typescript-operations@6.1.6'
  - '@graphql-codegen/visitor-plugin-common@7.2.5'
  - '@expo/ui@57.0.11'
  - '@expo/cli@57.0.15'
  - '@expo/config-plugins@57.0.8'
  - '@expo/metro-runtime@57.0.10'
  - '@expo/prebuild-config@57.0.12'
  - '@expo/router-server@57.0.6'
  - babel-preset-expo@57.0.7
  - expo-asset@57.0.11
  - expo-constants@57.0.11
  - expo-file-system@57.0.3 || 57.0.4
  - expo-modules-autolinking@57.0.10
  - expo-modules-core@57.0.11
  - expo-server@57.0.3
  - expo@57.0.13
  - expo-build-properties@57.0.11
  - expo-dev-client@57.0.12
  - expo-dev-launcher@57.0.12
  - expo-dev-menu@57.0.12
  - expo-image-picker@57.0.10
  - expo-image@57.0.3
  - expo-linking@57.0.6
  - expo-router@57.0.13
overrides:
  '@storybook/react': 10.4.2
  '@storybook/react-dom-shim': 10.4.2
  '@storybook/react-native-theming': 10.4.2
  '@storybook/react-native-ui': 10.4.2
  '@storybook/react-native-ui-common': 10.4.2
  react-dom: 19.2.3
